server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # JS/CSSはブラウザが独自判断で長期キャッシュしてしまうことがあるため、
    # 「使う前に必ずサーバーへ確認する（変更がなければ304、あれば新しい内容を取得）」設定にする。
    # config.js（API_BASE_URL等）の更新が反映されないトラブルを防ぐ。
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
